name: Prepare Release

on:
  push:
    branches:
      - main

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup JFrog npm
        uses: ./.github/actions/setup-jfrog-npm

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for releasable commits
        id: version
        run: |
          VERSION=$(pnpm exec release-it --release-version --ci) || true
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Next version: $VERSION"
          else
            echo "No releasable commits — skipping release preparation"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.version.outputs.version != ''
        run: |
          pnpm exec release-it ${{ steps.version.outputs.version }} --ci
      - name: Sync versions
        if: steps.version.outputs.version != ''
        run: pnpm exec tsx tools/sync-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build
        if: steps.version.outputs.version != ''
        run: pnpm build && pnpm --filter=docs build

      # Regenerate the bundle-size baseline from the released build. finalize
      # commits it (via the release App) so PRs diff against the last release.
      # Non-fatal: a size-tooling glitch must never block a release.
      - name: Bundle-size baseline
        if: steps.version.outputs.version != ''
        continue-on-error: true
        run: pnpm exec tsx tools/bundle-size.ts --baseline

      - name: Dist
        if: steps.version.outputs.version != ''
        run: |
          pnpm --filter=@databricks/appkit dist
          pnpm --filter=@databricks/appkit-ui dist

      - name: SBOM
        if: steps.version.outputs.version != ''
        run: pnpm release:sbom

      - name: Build NOTICE
        if: steps.version.outputs.version != ''
        run: pnpm build:notice

      - name: Pack
        if: steps.version.outputs.version != ''
        run: |
          npm pack packages/appkit/tmp
          npm pack packages/appkit-ui/tmp

      - name: Generate SHA256
        if: steps.version.outputs.version != ''
        run: sha256sum *.tgz > SHA256SUMS

      - name: Write version file
        if: steps.version.outputs.version != ''
        run: echo "${{ steps.version.outputs.version }}" > VERSION

      - name: Upload release metadata
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appkit-release-meta-${{ github.run_number }}
          retention-days: 7
          path: VERSION

      - name: Upload release artifacts
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appkit-release-${{ github.run_number }}
          retention-days: 7
          path: |
            *.tgz
            changelog-diff.md
            VERSION
            SHA256SUMS
            NOTICE.md
            bundle-size-baseline.json

  template-artifact:
    needs: [prepare]
    if: needs.prepare.outputs.version != ''
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup JFrog npm
        uses: ./.github/actions/setup-jfrog-npm

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appkit-release-${{ github.run_number }}
          path: release-artifacts

      - name: Prepare template artifact
        run: >
          pnpm exec tsx tools/prepare-template-artifact.ts
          --tarball-dir release-artifacts
          --output-dir template-artifact

      - name: Install template dependencies
        working-directory: template-artifact
        run: npm install

      - name: Create zip artifact
        working-directory: template-artifact
        run: zip -r ../template.zip . -x 'node_modules/*'

      - name: Upload template artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appkit-template-${{ github.run_number }}
          retention-days: 7
          path: template.zip
