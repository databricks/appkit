syntax = "proto3";

package appkit.v1;

import "google/protobuf/timestamp.proto";

// Standard error envelope for structured error reporting across services.
message Error {
  int32 code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Pagination request parameters.
message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// Pagination response metadata.
message PageResponse {
  string next_page_token = 1;
  int32 total_size = 2;
}

// Generic key-value metadata bag.
message Metadata {
  map<string, string> entries = 1;
}

// A flexible value type for heterogeneous data.
message Value {
  oneof kind {
    string string_value = 1;
    double number_value = 2;
    bool bool_value = 3;
    bytes bytes_value = 4;
    int64 int_value = 5;
    google.protobuf.Timestamp timestamp_value = 6;
  }
}
